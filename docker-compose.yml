#
# Usage (via scripts/link-sim-test.sh — do not invoke directly):
#
#   QUELAY_CAP=10Mbps         BW cap on the QUIC path (default: 10Mbps)
#   QUELAY_CONGESTION=new-reno Congestion algorithm: new-reno | bbr | cubic (default: new-reno)
#   LINK_SIM_PROFILE          path to TOML impairment profile (optional)
#   SIZE_MB                   payload size per stream for e2e (default: 100)
#
# Networks
# --------
#   quic-net  isolated bridge between agent-server <-> agent-client only.
#             link-sim applies tc netem impairment here. QUIC traffic only.
#
#   c2i-net   bridge shared by both agents, e2e, and (via port mapping) host.
#             Carries Thrift C2I, callback TCP, and ephemeral spool ports.
#             No impairment applied here.

networks:
  quic-net:
    driver: bridge
    internal: true      # no external routing; QUIC isolation
  c2i-net:
    driver: bridge

volumes:
  cert-vol:             # DER cert written by agent-server, read by agent-client

services:

  # --------------------------------------------------------------------------
  # agent-server  (QUIC server / receiving side)
  # --------------------------------------------------------------------------
  agent-server:
    container_name: quelay-agent-server
    build:
      context: .
      target: agent
    networks:
      quic-net:
        aliases:
          - agent-server-quic
      c2i-net:
    ports:
      - "9191:9191"     # C2I reachable from host and from e2e container
    volumes:
      - cert-vol:/app   # WORKDIR=/app; 'server' writes quelay-server.der here
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      QUELAY_MODE: server
      QUELAY_AGENT_ENDPOINT: "0.0.0.0:9191"
      QUELAY_CAP: ${QUELAY_CAP:-}
      QUELAY_CONGESTION: ${QUELAY_CONGESTION:-new-reno}
      QUELAY_BIND: "0.0.0.0:4433"
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoints/agent-healthcheck.sh", "9191"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  # --------------------------------------------------------------------------
  # agent-client  (QUIC client / sending side)
  # --------------------------------------------------------------------------
  agent-client:
    container_name: quelay-agent-client
    build:
      context: .
      target: agent
    networks:
      - quic-net
      - c2i-net
    ports:
      - "9190:9190"     # C2I reachable from host and from e2e container
    volumes:
      - cert-vol:/app   # reads /app/quelay-server.der written by server
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      QUELAY_MODE: client
      QUELAY_AGENT_ENDPOINT: "0.0.0.0:9190"
      QUELAY_CAP: ${QUELAY_CAP:-}
      QUELAY_CONGESTION: ${QUELAY_CONGESTION:-new-reno}
      QUELAY_PEER: "agent-server-quic:4433"
      QUELAY_CERT: "/app/quelay-server.der"
    depends_on:
      agent-server:
        condition: service_started  # must not be service_healthy — server blocks on QUIC
                                    # handshake before opening Thrift port, so healthy
                                    # requires the client to already be running.
    healthcheck:
      test: ["CMD", "/usr/local/bin/entrypoints/agent-healthcheck.sh", "9190"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 5s

  # --------------------------------------------------------------------------
  # link-sim — tc netem sidecar attached to agent-client's network namespace
  #
  # Runs as a sidecar sharing quelay-agent-client's network namespace.
  # Reads a TOML profile and applies a single tc netem qdisc to eth0,
  # enabling combined rate + delay + loss + corrupt + duplicate impairment.
  #
  # When LINK_SIM_PROFILE is unset, no impairment is applied and the
  # container exits immediately (clean/unimpaired test runs).
  #
  # Profile examples (in docker/link-sim/profiles/):
  #   BLOS-750ms.toml        satellite link, 750ms RTT, clean signal
  #   SZIP2-253.toml         severe: 750ms, 5% loss, corrupt, duplicate
  #   LOS-250ms.toml         line-of-sight, 250ms RTT, clean
  # --------------------------------------------------------------------------
  link-sim:
    build:
      context: docker/link-sim
    network_mode: "container:quelay-agent-client"
    cap_add:
      - NET_ADMIN
    volumes:
      - ./docker/link-sim/profiles:/profiles:ro
    environment:
      LINK_SIM_PROFILE: ${LINK_SIM_PROFILE:-}
      # eth1 is quic-net (172.19.0.0/16). eth0 is c2i-net (172.18.0.0/16).
      # Interface order is determined by network attachment order in this
      # compose file. If networks are reordered, re-verify with:
      #   docker run --rm --network container:quelay-agent-client nicolaka/netshoot ip addr
      LINK_SIM_IFACE: ${LINK_SIM_IFACE:-eth1}
    depends_on:
      agent-client:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # e2e — runs the integration test suite against both agents
  #
  # --callback-ip must be a routable IP (not a hostname) because the clap arg
  # is typed as std::net::IpAddr.  We resolve the container's own c2i-net IP
  # at startup with `hostname -i` via a shell wrapper.
  # --------------------------------------------------------------------------
  e2e:
    build:
      context: .
      target: e2e
    networks:
      - c2i-net
    environment:
      RUST_LOG: ${RUST_LOG:-info}
      E2E_ARGS: ${E2E_ARGS:-multi-file --size-mb 100 --bidirectional}
    depends_on:
      agent-client:
        condition: service_healthy
      agent-server:
        condition: service_healthy
      link-sim:
        condition: service_started
